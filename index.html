<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mi Web</title>

    <style>
        @font-face {
            font-family: 'PlanetKosmos';
            src: url('PlanetKosmos.ttf');
        }

        body {
            background-color: #111;
            color: white;
            font-family: 'PlanetKosmos';
            text-align: center;
            padding-top: 60px;
        }

        h1 {
            font-size: 40px;
            letter-spacing: 5px;
        }

        .boton {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border: 2px solid white;
            transition: 0.3s;
        }

        .boton:hover {
            background-color: white;
            color: black;
        }

        .gif-left {
            position: fixed;
            left: 10px;
            bottom: 10px;
            width: 120px;
        }

        .gif-right {
            position: fixed;
            right: 10px;
            top: 10px;
            width: 120px;
        }
    </style>
</head>

<body>

    <h1>MI ÁLBUM</h1>
    <p>Escuchá el proyecto completo acá:</p>

    <a class="boton" href="https://www.youtube.com/@jeejolinzy888" target="_blank">
        ESCUCHAR AHORA
    </a>

    <img src="gif1.gif" class="gif-left">
    <img src="gif2.gif" class="gif-right">

</body>
</html>
